app-id: org.radare.iaito

runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk

command: iaito
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --allow=devel
  - --env=QT_QPA_PLATFORM=wayland;xcb

cleanup:
  - /share/man
  - /share/zsh

build-options:
  env:
    R2PM_OFFLINE: yes

add-extensions:
# WebUI optional extension
  org.radare.iaito.webui:
    directory: share/iaito/webui
    bundle: true
    autodelete: true
    no-autodownload: true
    locale-subset: false

modules:
  - name: radare2
    buildsystem: autotools
    build-options:
      cflags: -O3
    config-opts:
      - --with-checks-level=0
    # Not working right now, moving it manually at post-install
    # - R2_WWWROOT=/app/share/iaito/webui/www
    post-install:
      - mkdir -p /app/share/iaito/webui
      - mv /app/share/radare2/*.*.*/www /app/share/iaito/webui/
      - ln -s ../../iaito/webui/www /app/share/radare2/*.*.*/
      - install -Dpm644 -t /app/share/iaito/webui/share/metainfo org.radare.iaito.webui.metainfo.xml
      - appstreamcli compose --no-net --prefix=/ --components=org.radare.iaito.webui
        --origin=org.radare.iaito.webui --result-root=/app/share/iaito/webui --data-dir=/app/share/iaito/webui/share/app-info/xmls
        /app/share/iaito/webui
    sources:
      - type: archive
        url: https://github.com/radareorg/radare2/releases/download/6.2.6/radare2-6.2.6.tar.xz
        archive-type: tar-xz
        sha256: 1a0e09c0f781337ae8cd3f4a1d295ac64344d0b019031f75755dbc8e246b9f8a
        x-checker-data:
          type: json
          url: https://api.github.com/repos/radareorg/radare2/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          url-query: |-
            .assets[] | select(.name=="radare2-" + $version + ".tar.xz") | .browser_download_url
      - type: file
        path: extensions/org.radare.iaito.webui.metainfo.xml

  - name: r2ghidra
    buildsystem: autotools
    build-options:
      cflags: -O3
    sources:
      - type: archive
        url: https://github.com/radareorg/r2ghidra/releases/download/6.2.6/r2ghidra-6.2.6.tar.xz
        archive-type: tar-xz
        sha256: 4fe9aeb4ab226b6b552b5d61a284f9b6b08b20579bbac1bcaa6785bfe957991f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/radareorg/r2ghidra/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          url-query: |-
            .assets[] | select(.name=="r2ghidra-" + $version + ".tar.xz") | .browser_download_url

  - name: r2frida
    buildsystem: autotools
    build-options:
      cflags: -O3 -w
    config-opts:
      - --with-precompiled-agent
      - --with-checks-level=0
    make-args:
      - DLCMD=false
    sources:
      - type: git
        url: https://github.com/nowsecure/r2frida.git
        tag: 6.2.6
        commit: 6f9091ebe9273a85c42e37245be8b50cdce6008d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/nowsecure/r2frida/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          tag-query: .tag_name
      - type: file
        url: https://github.com/nowsecure/r2frida/releases/download/6.2.6/_agent.js
        sha256: 29b0600dadda56fc21c472df5a8b364d24a3580c4ab1ab5e77947f7bd9b922c7
        dest: src
        dest-filename: _agent.js
        x-checker-data:
          type: json
          url: https://api.github.com/repos/nowsecure/r2frida/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          url-query: |-
            .assets[] | select(.name=="_agent.js") | .browser_download_url
      - type: file
        url: https://github.com/frida/frida/releases/download/17.26.0/frida-core-devkit-17.26.0-linux-x86_64.tar.xz
        sha256: 154e2451ee4d27de587640c7b705d8d48aa5973dc29f3c2dd0469b37a589d5bf
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/nowsecure/r2frida/releases/latest
          version-query: .body | capture("[Ff]rida +(?<frida_version>[0-9.]+)") |
            .frida_version
          url-data-url: >-
            "https://api.github.com/repos/frida/frida/releases/tags/\($version)"
          url-query: |-
            .assets[] | select(.name=="frida-core-devkit-" + $version + "-linux-x86_64.tar.xz") | .browser_download_url
      - type: file
        url: https://github.com/frida/frida/releases/download/17.26.0/frida-core-devkit-17.26.0-linux-arm64.tar.xz
        sha256: d9caf12980dace4af51bcef99616f6e9851342a921c0d1ad723f275ca93080de
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/nowsecure/r2frida/releases/latest
          version-query: .body | capture("[Ff]rida +(?<frida_version>[0-9.]+)") |
            .frida_version
          url-data-url: >-
            "https://api.github.com/repos/frida/frida/releases/tags/\($version)"
          url-query: |-
            .assets[] | select(.name=="frida-core-devkit-" + $version + "-linux-arm64.tar.xz") | .browser_download_url
      - type: shell # decompress frida-sdk keeping its own version
        commands:
          - FRIDA_DEST=$(echo frida-core-devkit-*.tar.xz | sed -r 's,^.*-([0-9\.]+)-.*$,ext/frida-linux-\1,');
            mkdir -vp "${FRIDA_DEST}" && tar -vxJf frida-core-devkit-*.tar.xz -C "${FRIDA_DEST}"
          - rm -vf frida-core-devkit-*.tar.xz

  - name: r2dec
    buildsystem: meson
    build-options:
      cflags: -O3
    sources:
      - type: git
        url: https://github.com/wargio/r2dec-js.git
        tag: 6.2.0
        commit: 32ada0dc8bffd1e3ec55d6134531eaae244502ed
        x-checker-data:
          type: json
          url: https://api.github.com/repos/wargio/r2dec-js/releases/latest
          tag-query: .tag_name
          version-query: $tag
          timestamp-query: .published_at
      # r2dec meson subprojects
      - type: git
        url: https://github.com/quickjs-ng/quickjs.git
        tag: v0.8.0
        commit: 482291286b9960c255ff8765d18a618cc87d89a2
        dest: subprojects/libquickjs
      - type: shell
        commands:
          - meson subprojects packagefiles --apply
  - name: r2yara
    buildsystem: autotools
    build-options:
      cflags: -O3
    config-opts:
      - --with-checks-level=0
    sources:
      - type: git
        url: https://github.com/radareorg/r2yara.git
        tag: 1.5.2
        commit: f223ca55b77a373231b56415125980d5e8d89fdd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/radareorg/r2yara/releases/latest
          tag-query: .tag_name
          version-query: $tag
          timestamp-query: .published_at
    modules:
      - name: yara
        buildsystem: autotools
        build-options:
          cflags: -O3
        sources:
          - type: git
            url: https://github.com/VirusTotal/yara.git
            tag: v4.6.0
            commit: 6d47342e825e59f5d8f20874d0778332bcec83a6
            x-checker-data:
              type: json
              url: https://api.github.com/repos/VirusTotal/yara/releases/latest
              tag-query: .tag_name
              version-query: $tag | sub("^v"; "")
              timestamp-query: .published_at
          - type: shell
            commands:
              - ./bootstrap.sh

  - name: r2ai
    buildsystem: simple
    build-commands:
      - make -C src
      - make -C src install
      - make -C decai install
    sources:
      - type: git
        url: https://github.com/radareorg/r2ai.git
        tag: 1.5.4
        commit: 287fad0ecdec473bed73bde54a5c3ddda94a855d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/radareorg/r2ai/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          tag-query: .tag_name

  - name: r2pipe-python
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/c4/3d/4f7dceea20d987c6b2d693584e49991f97071a5b68b0d084aa5a43b70a23/r2pipe-2.1.0.tar.gz
        sha256: 7dcfa14fc3436e0ec887b0397daf4c8d7882a0320a333fbdc6aa3797fa1a929a
        x-checker-data:
          type: pypi
          name: r2pipe

  - name: iaito
    buildsystem: qmake
    config-opts:
      - -config
      - release
      - IAITO_ENABLE_DEBUGGER=false
    subdir: src
    sources:
      - type: git
        url: https://github.com/radareorg/iaito.git
        tag: 6.2.6
        commit: 49b4b19c21f9b1020c5862327de6b1e4e6ee04f0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/radareorg/iaito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          tag-query: .tag_name
          is-main-source: true

  - name: iaito-translations
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: git
        url: https://github.com/radareorg/iaito-translations.git
        tag: '20221114'
        commit: e66b3a962a7fc7dfd730764180011ecffbb206bf
        x-checker-data:
          type: json
          url: https://api.github.com/repos/radareorg/iaito-translations/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name
          tag-query: .tag_name
